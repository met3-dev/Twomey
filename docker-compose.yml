version: "3.9"

services:
  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      food_beverage:
        condition: service_healthy
    environment:
      - FOOD_BEVERAGE_URL=http://food_beverage:8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  food_beverage:
    build: ./agents/food_beverage
    ports:
      - "8001:8001"
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
